<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Feedback — Sistema de Feedback</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
  <style>
    body { background: #f0f4f8; }
    .sidebar { width:260px; min-height:100vh; background:#1e3a5f; position:fixed; top:0; left:0; display:flex; flex-direction:column; }
    .sidebar-brand { padding:1.5rem; background:rgba(0,0,0,.2); text-align:center; }
    .sidebar-brand h5 { color:#fff; font-weight:700; margin:.5rem 0 0; font-size:.95rem; }
    .sidebar-brand p { color:rgba(255,255,255,.5); font-size:.75rem; margin:0; }
    .nav-section { padding:.75rem 1.25rem .25rem; color:rgba(255,255,255,.4); font-size:.7rem; font-weight:700; letter-spacing:1px; text-transform:uppercase; }
    .sidebar .nav-link { color:rgba(255,255,255,.75); padding:.6rem 1.25rem; display:flex; align-items:center; gap:.6rem; border-radius:8px; margin:.1rem .75rem; font-size:.9rem; transition:all .2s; }
    .sidebar .nav-link:hover, .sidebar .nav-link.active { background:rgba(255,255,255,.12); color:#fff; }
    .sidebar .sub-link { padding-left:2.8rem; font-size:.85rem; }
    .main { margin-left:260px; padding:2rem; }
    .topbar { background:#fff; border-radius:12px; padding:1rem 1.5rem; margin-bottom:2rem; display:flex; align-items:center; justify-content:space-between; box-shadow:0 2px 8px rgba(0,0,0,.06); }
    .topbar h6 { margin:0; font-weight:600; color:#1e3a5f; }
    .card { border:none; border-radius:12px; box-shadow:0 2px 8px rgba(0,0,0,.08); }
    .card-header { background:#fff; border-bottom:1px solid #eee; border-radius:12px 12px 0 0 !important; padding:15px 20px; display:flex; justify-content:space-between; align-items:center; }
    .table thead th { background:#f8f9fa; font-size:12px; text-transform:uppercase; letter-spacing:.5px; color:#666; border:none; }
    .table tbody tr:hover { background:#f5f7ff; }
    .badge-obs { max-width:280px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; display:inline-block; vertical-align:middle; }
  </style>
</head>
<body>

<nav class="sidebar">
  <div class="sidebar-brand">
    <i class="bi bi-bar-chart-fill text-white fs-2"></i>
    <h5>Sistema de Feedback</h5>
    <p>Controle de Produtos</p>
  </div>
  <div class="mt-2">
    <div class="nav-section">Principal</div>
    <a href="/dashboard" class="nav-link"><i class="bi bi-speedometer2"></i> Dashboard</a>
    <div class="nav-section mt-2">Módulos</div>
    <a class="nav-link" data-bs-toggle="collapse" href="#menuCadastros">
      <i class="bi bi-folder2-open"></i> Cadastros
      <i class="bi bi-chevron-down ms-auto"></i>
    </a>
    <div class="collapse show" id="menuCadastros">
      <a href="/cadastros/usuarios" class="nav-link sub-link"><i class="bi bi-people"></i> Usuários</a>
      <a href="/cadastros/clientes" class="nav-link sub-link"><i class="bi bi-person-vcard"></i> Clientes</a>
      <a href="/cadastros/produtos" class="nav-link sub-link"><i class="bi bi-box-seam"></i> Produtos</a>
      <a href="/cadastros/feedback" class="nav-link sub-link active"><i class="bi bi-chat-left-text"></i> Feedbacks</a>
    </div>
  </div>
  <div class="mt-auto p-3">
    <button onclick="logout()" class="btn btn-sm btn-outline-light w-100">
      <i class="bi bi-box-arrow-right me-1"></i> Sair
    </button>
  </div>
</nav>

<main class="main">
  <div class="topbar">
    <h6><i class="bi bi-chat-left-text me-2 text-primary"></i>Cadastros / Feedbacks</h6>
    <span id="nomeUsuario" class="text-muted small"></span>
  </div>

  <div class="card">
    <div class="card-header">
      <span class="fw-semibold text-secondary" style="font-size:14px">
        <i class="bi bi-list me-2"></i>Lista de Feedbacks
      </span>
      <button class="btn btn-primary btn-sm" onclick="abrirModalNovo()">
        <i class="bi bi-plus me-1"></i>Novo Feedback
      </button>
    </div>
    <div class="card-body p-0">
      <table class="table table-hover mb-0">
        <thead>
          <tr>
            <th class="ps-4">#</th>
            <th>Cliente</th>
            <th>Produto</th>
            <th>Observação</th>
            <th>Horário</th>
            <th class="text-center">Ações</th>
          </tr>
        </thead>
        <tbody id="tbody-feedback">
          <tr><td colspan="6" class="text-center py-4 text-muted">Carregando...</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</main>

<!-- Modal Novo/Editar Feedback -->
<div class="modal fade" id="modalFeedback" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content border-0 shadow">
      <div class="modal-header" style="background:#1e3a5f;color:#fff">
        <h5 class="modal-title" id="modal-titulo">
          <i class="bi bi-chat-left-text me-2"></i>Novo Feedback
        </h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="feedback-id"/>

        <div class="mb-3">
          <label class="form-label fw-semibold">Cliente <span class="text-muted fw-normal">(opcional)</span></label>
          <select class="form-select" id="feedback-cliente">
            <option value="">— Sem cliente —</option>
          </select>
        </div>

        <div class="mb-3">
          <label class="form-label fw-semibold">Produto <span class="text-muted fw-normal">(opcional)</span></label>
          <select class="form-select" id="feedback-produto">
            <option value="">— Sem produto —</option>
          </select>
        </div>

        <div class="mb-3">
          <label class="form-label fw-semibold">Observação <span class="text-danger">*</span></label>
          <textarea class="form-control" id="feedback-observacao" rows="4"
            placeholder="Descreva o feedback recebido..."></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button class="btn btn-primary" onclick="salvarFeedback()">
          <i class="bi bi-save me-1"></i>Salvar
        </button>
      </div>
    </div>
  </div>
</div>

<!-- Modal Confirmar Exclusão -->
<div class="modal fade" id="modalExcluir" tabindex="-1">
  <div class="modal-dialog modal-sm">
    <div class="modal-content border-0 shadow">
      <div class="modal-header bg-danger text-white">
        <h5 class="modal-title"><i class="bi bi-trash me-2"></i>Excluir</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body text-center">
        <p class="mb-0">Deseja excluir este feedback?</p>
      </div>
      <div class="modal-footer justify-content-center">
        <button class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Não</button>
        <button class="btn btn-danger btn-sm" onclick="confirmarExclusao()">
          <i class="bi bi-trash me-1"></i>Sim, excluir
        </button>
      </div>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="position-fixed bottom-0 end-0 p-3" style="z-index:9999">
  <div id="toast" class="toast align-items-center text-white border-0" role="alert">
    <div class="d-flex">
      <div class="toast-body" id="toast-msg"></div>
      <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  let idParaExcluir = null;

  // Verifica autenticação
  fetch('/api/me', { credentials: 'include' })
    .then(r => r.json())
    .then(d => {
      if (!d.autenticado) { window.location.href = '/'; return; }
      document.getElementById('nomeUsuario').textContent = '👤 ' + d.usuario.nome;
    });

  async function carregarSelects() {
    const [clientes, produtos] = await Promise.all([
      fetch('/api/clientes', { credentials: 'include' }).then(r => r.json()),
      fetch('/api/produtos',  { credentials: 'include' }).then(r => r.json()),
    ]);

    const selCliente = document.getElementById('feedback-cliente');
    selCliente.innerHTML = '<option value="">— Sem cliente —</option>' +
      clientes.map(c => `<option value="${c.id}">${c.nome}</option>`).join('');

    const selProduto = document.getElementById('feedback-produto');
    selProduto.innerHTML = '<option value="">— Sem produto —</option>' +
      produtos.map(p => `<option value="${p.id}">${p.descricao}</option>`).join('');
  }

  async function carregarFeedbacks() {
    const tbody = document.getElementById('tbody-feedback');
    try {
      const res = await fetch('/api/feedback', { credentials: 'include' });
      if (res.status === 401) { window.location.href = '/'; return; }
      const feedbacks = await res.json();

      if (!feedbacks.length) {
        tbody.innerHTML = '<tr><td colspan="6" class="text-center py-4 text-muted">Nenhum feedback cadastrado.</td></tr>';
        return;
      }

      tbody.innerHTML = feedbacks.map((f, i) => `
        <tr>
          <td class="ps-4">${i + 1}</td>
          <td>${f.cliente_nome || '<span class="text-muted">—</span>'}</td>
          <td>${f.produto_descricao || '<span class="text-muted">—</span>'}</td>
          <td><span class="badge-obs" title="${f.observacao}">${f.observacao}</span></td>
          <td><span class="text-muted small">${f.datahora || '—'}</span></td>
          <td class="text-center">
            <button class="btn btn-outline-primary btn-sm me-1"
              onclick="abrirModalEditar(${f.id}, ${f.cliente_id || 'null'}, ${f.produto_id || 'null'}, \`${f.observacao.replace(/`/g, "'")}\`)">
              <i class="bi bi-pencil"></i>
            </button>
            <button class="btn btn-outline-danger btn-sm" onclick="abrirModalExcluir(${f.id})">
              <i class="bi bi-trash"></i>
            </button>
          </td>
        </tr>
      `).join('');
    } catch (e) {
      tbody.innerHTML = '<tr><td colspan="6" class="text-center py-4 text-danger">Erro ao carregar feedbacks.</td></tr>';
    }
  }

  function abrirModalNovo() {
    document.getElementById('feedback-id').value = '';
    document.getElementById('feedback-cliente').value = '';
    document.getElementById('feedback-produto').value = '';
    document.getElementById('feedback-observacao').value = '';
    document.getElementById('modal-titulo').innerHTML = '<i class="bi bi-chat-left-text me-2"></i>Novo Feedback';
    new bootstrap.Modal(document.getElementById('modalFeedback')).show();
  }

  function abrirModalEditar(id, clienteId, produtoId, observacao) {
    document.getElementById('feedback-id').value = id;
    document.getElementById('feedback-cliente').value = clienteId || '';
    document.getElementById('feedback-produto').value = produtoId || '';
    document.getElementById('feedback-observacao').value = observacao;
    document.getElementById('modal-titulo').innerHTML = '<i class="bi bi-pencil me-2"></i>Editar Feedback';
    new bootstrap.Modal(document.getElementById('modalFeedback')).show();
  }

  async function salvarFeedback() {
    const id          = document.getElementById('feedback-id').value;
    const cliente_id  = document.getElementById('feedback-cliente').value || null;
    const produto_id  = document.getElementById('feedback-produto').value || null;
    const observacao  = document.getElementById('feedback-observacao').value.trim();

    if (!observacao) { mostrarToast('A observação é obrigatória.', 'bg-warning'); return; }

    const url    = id ? `/api/feedback/${id}` : '/api/feedback';
    const method = id ? 'PUT' : 'POST';

    const res = await fetch(url, {
      method,
      headers: { 'Content-Type': 'application/json' },
      credentials: 'include',
      body: JSON.stringify({
        cliente_id: cliente_id ? parseInt(cliente_id) : null,
        produto_id: produto_id ? parseInt(produto_id) : null,
        observacao
      })
    });

    const data = await res.json();
    if (!res.ok) { mostrarToast(data.error || 'Erro ao salvar.', 'bg-danger'); return; }

    bootstrap.Modal.getInstance(document.getElementById('modalFeedback')).hide();
    mostrarToast(id ? 'Feedback atualizado!' : 'Feedback registrado!', 'bg-success');
    carregarFeedbacks();
  }

  function abrirModalExcluir(id) {
    idParaExcluir = id;
    new bootstrap.Modal(document.getElementById('modalExcluir')).show();
  }

  async function confirmarExclusao() {
    const res = await fetch(`/api/feedback/${idParaExcluir}`, {
      method: 'DELETE', credentials: 'include'
    });
    bootstrap.Modal.getInstance(document.getElementById('modalExcluir')).hide();
    if (res.ok) { mostrarToast('Feedback excluído!', 'bg-success'); carregarFeedbacks(); }
    else mostrarToast('Erro ao excluir.', 'bg-danger');
  }

  function mostrarToast(msg, bgClass) {
    const toast = document.getElementById('toast');
    toast.className = `toast align-items-center text-white border-0 ${bgClass}`;
    document.getElementById('toast-msg').textContent = msg;
    new bootstrap.Toast(toast, { delay: 3000 }).show();
  }

  async function logout() {
    await fetch('/api/logout', { method: 'POST', credentials: 'include' });
    window.location.href = '/';
  }

  // Inicializa
  carregarSelects();
  carregarFeedbacks();
</script>
</body>
</html>
