<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login — Sistema de Feedback</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
  <style>
    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #1e3a5f 0%, #2563eb 100%);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card-login {
      border: none;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    .card-login .card-header {
      background: #1e3a5f;
      border-radius: 16px 16px 0 0;
      padding: 2rem;
      text-align: center;
    }
    .btn-entrar {
      background: #2563eb;
      border: none;
      font-weight: 600;
      letter-spacing: .5px;
    }
    .btn-entrar:hover { background: #1d4ed8; }
    .form-control:focus { border-color: #2563eb; box-shadow: 0 0 0 .25rem rgba(37,99,235,.2); }
    .alerta { display: none; }
  </style>
</head>
<body>
  <div class="col-11 col-sm-8 col-md-5 col-lg-4">
    <div class="card card-login">
      <div class="card-header text-white">
        <i class="bi bi-bar-chart-fill fs-1 mb-2 d-block"></i>
        <h4 class="mb-0 fw-bold">Sistema de Feedback</h4>
        <p class="mb-0 text-white-50 small">Controle de Produtos</p>
      </div>
      <div class="card-body p-4">
        <div id="alerta" class="alert alert-danger alerta" role="alert"></div>
        <form id="formLogin">
          <div class="mb-3">
            <label class="form-label fw-semibold text-secondary small">USUÁRIO</label>
            <div class="input-group">
              <span class="input-group-text bg-light"><i class="bi bi-person"></i></span>
              <input type="text" id="login" class="form-control" placeholder="Seu login" required autofocus/>
            </div>
          </div>
          <div class="mb-4">
            <label class="form-label fw-semibold text-secondary small">SENHA</label>
            <div class="input-group">
              <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
              <input type="password" id="senha" class="form-control" placeholder="Sua senha" required/>
            </div>
          </div>
          <button type="submit" class="btn btn-entrar btn-primary w-100 py-2">
            <i class="bi bi-box-arrow-in-right me-1"></i> Entrar
          </button>
        </form>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('formLogin').addEventListener('submit', async (e) => {
      e.preventDefault();
      const alerta = document.getElementById('alerta');
      alerta.style.display = 'none';

      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          login: document.getElementById('login').value,
          senha: document.getElementById('senha').value,
        }),
      });

      const data = await res.json();
      if (res.ok) {
        window.location.href = '/dashboard';
      } else {
        alerta.textContent = data.erro;
        alerta.style.display = 'block';
      }
    });

    // Redireciona se já logado
    fetch('/api/me').then(r => r.json()).then(d => {
      if (d.autenticado) window.location.href = '/dashboard';
    });
  </script>
</body>
</html>
