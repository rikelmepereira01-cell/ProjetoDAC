<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Produtos — Sistema de Feedback</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
  <style>
    body { background: #f0f4f8; }
    .sidebar { width:260px; min-height:100vh; background:#1e3a5f; position:fixed; top:0; left:0; display:flex; flex-direction:column; }
    .sidebar-brand { padding:1.5rem; background:rgba(0,0,0,.2); text-align:center; }
    .sidebar-brand h5 { color:#fff; font-weight:700; margin:.5rem 0 0; font-size:.95rem; }
    .sidebar-brand p { color:rgba(255,255,255,.5); font-size:.75rem; margin:0; }
    .nav-section { padding:.75rem 1.25rem .25rem; color:rgba(255,255,255,.4); font-size:.7rem; font-weight:700; letter-spacing:1px; text-transform:uppercase; }
    .sidebar .nav-link { color:rgba(255,255,255,.75); padding:.6rem 1.25rem; display:flex; align-items:center; gap:.6rem; border-radius:8px; margin:.1rem .75rem; font-size:.9rem; transition:all .2s; }
    .sidebar .nav-link:hover, .sidebar .nav-link.active { background:rgba(255,255,255,.12); color:#fff; }
    .sidebar .sub-link { padding-left:2.8rem; font-size:.85rem; }
    .main { margin-left:260px; padding:2rem; }
    .topbar { background:#fff; border-radius:12px; padding:1rem 1.5rem; margin-bottom:2rem; display:flex; align-items:center; justify-content:space-between; box-shadow:0 2px 8px rgba(0,0,0,.06); }
    .topbar h6 { margin:0; font-weight:600; color:#1e3a5f; }
  </style>
</head>
<body>
<nav class="sidebar">
  <div class="sidebar-brand">
    <i class="bi bi-bar-chart-fill text-white fs-2"></i>
    <h5>Sistema de Feedback</h5>
    <p>Controle de Produtos</p>
  </div>
  <div class="mt-2">
    <div class="nav-section">Principal</div>
    <a href="/dashboard" class="nav-link"><i class="bi bi-speedometer2"></i> Dashboard</a>
    <div class="nav-section mt-2">Módulos</div>
    <a class="nav-link" data-bs-toggle="collapse" href="#menuCadastros">
      <i class="bi bi-folder2-open"></i> Cadastros
      <i class="bi bi-chevron-down ms-auto"></i>
    </a>
<div class="collapse show" id="menuCadastros">
  <a href="/cadastros/usuarios" class="nav-link sub-link"><i class="bi bi-people"></i> Usuários</a>
  <a href="/cadastros/clientes" class="nav-link sub-link"><i class="bi bi-person-vcard"></i> Clientes</a>
  <a href="/cadastros/produtos" class="nav-link sub-link active"><i class="bi bi-box-seam"></i> Produtos</a>
  <a href="/cadastros/feedback" class="nav-link sub-link"><i class="bi bi-chat-left-text"></i> Feedbacks</a>
</div>
  </div>
  <div class="mt-auto p-3">
    <button onclick="logout()" class="btn btn-sm btn-outline-light w-100">
      <i class="bi bi-box-arrow-right me-1"></i> Sair
    </button>
  </div>
</nav>

<main class="main">
  <div class="topbar">
    <h6><i class="bi bi-box-seam me-2 text-primary"></i>Cadastros / Produtos</h6>
    <span id="nomeUsuario" class="text-muted small"></span>
  </div>

  <!-- Tipos de Produto -->
  <div class="card mb-4 border-0 shadow-sm rounded-3">
    <div class="card-header bg-white d-flex justify-content-between align-items-center">
      <span class="fw-semibold text-secondary" style="font-size:14px"><i class="bi bi-tags me-2"></i>Tipos de Produto</span>
      <button class="btn btn-outline-primary btn-sm" onclick="abrirModalTipo()"><i class="bi bi-plus me-1"></i>Novo Tipo</button>
    </div>
    <div class="card-body p-0">
      <table class="table table-hover mb-0" id="tabela-tipos">
        <thead><tr><th class="ps-4">#</th><th>Descrição</th><th class="text-center">Ações</th></tr></thead>
        <tbody id="tbody-tipos"><tr><td colspan="3" class="text-center py-3 text-muted">Carregando...</td></tr></tbody>
      </table>
    </div>
  </div>

  <!-- Produtos -->
  <div class="card border-0 shadow-sm rounded-3">
    <div class="card-header bg-white d-flex justify-content-between align-items-center">
      <span class="fw-semibold text-secondary" style="font-size:14px"><i class="bi bi-box-seam me-2"></i>Produtos</span>
      <button class="btn btn-primary btn-sm" onclick="abrirModalProduto()"><i class="bi bi-plus me-1"></i>Novo Produto</button>
    </div>
    <div class="card-body p-0">
      <table class="table table-hover mb-0">
        <thead><tr><th class="ps-4">#</th><th>Descrição</th><th>Tipo</th><th class="text-center">Ações</th></tr></thead>
        <tbody id="tbody-produtos"><tr><td colspan="4" class="text-center py-3 text-muted">Carregando...</td></tr></tbody>
      </table>
    </div>
  </div>
</main>

<!-- Modal Tipo -->
<div class="modal fade" id="modalTipo" tabindex="-1">
  <div class="modal-dialog modal-sm">
    <div class="modal-content border-0 shadow">
      <div class="modal-header" style="background:#1e3a5f;color:#fff">
        <h5 class="modal-title"><i class="bi bi-tag me-2"></i>Tipo de Produto</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="tipo-id"/>
        <div class="mb-3">
          <label class="form-label fw-semibold">Descrição</label>
          <input type="text" class="form-control" id="tipo-descricao" placeholder="Ex: Eletrônico"/>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button class="btn btn-primary" onclick="salvarTipo()"><i class="bi bi-save me-1"></i>Salvar</button>
      </div>
    </div>
  </div>
</div>

<!-- Modal Produto -->
<div class="modal fade" id="modalProduto" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content border-0 shadow">
      <div class="modal-header" style="background:#1e3a5f;color:#fff">
        <h5 class="modal-title" id="modal-produto-titulo"><i class="bi bi-box-seam me-2"></i>Novo Produto</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="produto-id"/>
        <div class="mb-3">
          <label class="form-label fw-semibold">Descrição</label>
          <input type="text" class="form-control" id="produto-descricao" placeholder="Ex: Notebook Dell"/>
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold">Tipo de Produto</label>
          <select class="form-select" id="produto-tipo"></select>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button class="btn btn-primary" onclick="salvarProduto()"><i class="bi bi-save me-1"></i>Salvar</button>
      </div>
    </div>
  </div>
</div>

<!-- Modal Excluir -->
<div class="modal fade" id="modalExcluir" tabindex="-1">
  <div class="modal-dialog modal-sm">
    <div class="modal-content border-0 shadow">
      <div class="modal-header bg-danger text-white">
        <h5 class="modal-title"><i class="bi bi-trash me-2"></i>Excluir</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body text-center">
        <p class="mb-1">Deseja excluir <strong id="nome-excluir"></strong>?</p>
      </div>
      <div class="modal-footer justify-content-center">
        <button class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Não</button>
        <button class="btn btn-danger btn-sm" onclick="confirmarExclusao()"><i class="bi bi-trash me-1"></i>Sim</button>
      </div>
    </div>
  </div>
</div>

<div class="position-fixed bottom-0 end-0 p-3" style="z-index:9999">
  <div id="toast" class="toast align-items-center text-white border-0" role="alert">
    <div class="d-flex">
      <div class="toast-body" id="toast-msg"></div>
      <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/produtos.js"></script>
</body>
</html>
